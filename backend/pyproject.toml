[project]
name = "txn-validation"
version = "0.1.0"
description = "Transaction validation agent: FastAPI server, LangGraph agent, MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
]

[tool.uv]
package = false
